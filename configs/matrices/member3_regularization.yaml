name: member3_regularization
owner: member_3
base_config: configs/base.yaml
approved: false
seeds: [42, 2026]
expected_unique_configs: 8

# weight-decay-only is the shared anchor owned by member 1.
experiments:
  - id: reg_none
    label: "No studied regularizer"
    comparison_groups: [regularization]
    overrides: {optimizer.weight_decay: 0.0}
  - id: reg_dropout_01
    label: "Dropout 0.1"
    comparison_groups: [regularization]
    overrides: {optimizer.weight_decay: 0.0, model.dropout: 0.1}
  - id: reg_dropout_03
    label: "Dropout 0.3"
    comparison_groups: [regularization]
    overrides: {optimizer.weight_decay: 0.0, model.dropout: 0.3}
  - id: reg_dropout_05
    label: "Dropout 0.5"
    comparison_groups: [regularization]
    overrides: {optimizer.weight_decay: 0.0, model.dropout: 0.5}
  - id: reg_augmentation
    label: "Data augmentation"
    comparison_groups: [regularization]
    overrides: {optimizer.weight_decay: 0.0, data.augmentation: true}
  - id: reg_early_stopping
    label: "Early stopping"
    comparison_groups: [regularization]
    overrides:
      optimizer.weight_decay: 0.0
      regularization.early_stopping.enabled: true
  - id: reg_wd_augmentation
    label: "Weight decay + augmentation"
    comparison_groups: [regularization]
    overrides: {optimizer.weight_decay: 0.0005, data.augmentation: true}
  - id: reg_combined
    label: "WD + Dropout 0.3 + augmentation + early stopping"
    comparison_groups: [regularization]
    overrides:
      optimizer.weight_decay: 0.0005
      model.dropout: 0.3
      data.augmentation: true
      regularization.early_stopping.enabled: true
