name: member1_optimizer_norm
owner: member_1
base_config: configs/base.yaml
approved: false
seeds: [42, 2026]
expected_unique_configs: 14

# The shared anchor is counted in four comparisons. Running it once saves six runs.
experiments:
  - id: anchor_sgdm_wd_bn_b128
    label: "Anchor: SGD+momentum | constant/no warm-up | WD | BN/batch 128"
    comparison_groups: [optimizer, schedule, normalization, regularization]
    overrides:
      optimizer.name: sgd_momentum
      optimizer.lr: 0.1
      optimizer.weight_decay: 0.0005
      scheduler.name: constant
      scheduler.warmup_epochs: 0
      model.normalization: batch
      model.dropout: 0.0
      data.batch_size: 128
      data.augmentation: false
      regularization.early_stopping.enabled: false

  - id: opt_sgd
    label: "SGD"
    comparison_groups: [optimizer]
    overrides: {optimizer.name: sgd, optimizer.lr: 0.1}
  - id: opt_nesterov
    label: "Nesterov"
    comparison_groups: [optimizer]
    overrides: {optimizer.name: nesterov, optimizer.lr: 0.1}
  - id: opt_rmsprop
    label: "RMSProp (momentum 0.9)"
    comparison_groups: [optimizer]
    overrides: {optimizer.name: rmsprop, optimizer.lr: 0.001}
  - id: opt_adam
    label: "Adam"
    comparison_groups: [optimizer]
    overrides: {optimizer.name: adam, optimizer.lr: 0.001}
  - id: opt_adamw
    label: "AdamW"
    comparison_groups: [optimizer]
    overrides: {optimizer.name: adamw, optimizer.lr: 0.001}

  - id: norm_bn_b8
    label: "BatchNorm, batch 8"
    comparison_groups: [normalization]
    overrides: {model.normalization: batch, data.batch_size: 8}
  - id: norm_bn_b32
    label: "BatchNorm, batch 32"
    comparison_groups: [normalization]
    overrides: {model.normalization: batch, data.batch_size: 32}
  - id: norm_ln_b8
    label: "LayerNorm, batch 8"
    comparison_groups: [normalization]
    overrides: {model.normalization: layer, data.batch_size: 8}
  - id: norm_ln_b32
    label: "LayerNorm, batch 32"
    comparison_groups: [normalization]
    overrides: {model.normalization: layer, data.batch_size: 32}
  - id: norm_ln_b128
    label: "LayerNorm, batch 128"
    comparison_groups: [normalization]
    overrides: {model.normalization: layer, data.batch_size: 128}
  - id: norm_gn_b8
    label: "GroupNorm, batch 8"
    comparison_groups: [normalization]
    overrides: {model.normalization: group, data.batch_size: 8}
  - id: norm_gn_b32
    label: "GroupNorm, batch 32"
    comparison_groups: [normalization]
    overrides: {model.normalization: group, data.batch_size: 32}
  - id: norm_gn_b128
    label: "GroupNorm, batch 128"
    comparison_groups: [normalization]
    overrides: {model.normalization: group, data.batch_size: 128}
