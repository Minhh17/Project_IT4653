name: member2_schedules
owner: member_2
base_config: configs/base.yaml
approved: false
seeds: [42, 2026]
expected_unique_configs: 5

# constant/no-warm-up is the shared anchor owned by member 1.
experiments:
  - id: sched_constant_warmup
    label: "Constant + warm-up"
    comparison_groups: [schedule]
    overrides: {scheduler.name: constant, scheduler.warmup_epochs: 2}
  - id: sched_step
    label: "Step decay"
    comparison_groups: [schedule]
    overrides: {scheduler.name: step, scheduler.warmup_epochs: 0}
  - id: sched_step_warmup
    label: "Step decay + warm-up"
    comparison_groups: [schedule]
    overrides: {scheduler.name: step, scheduler.warmup_epochs: 2}
  - id: sched_cosine
    label: "Cosine annealing"
    comparison_groups: [schedule]
    overrides: {scheduler.name: cosine, scheduler.warmup_epochs: 0}
  - id: sched_cosine_warmup
    label: "Cosine annealing + warm-up"
    comparison_groups: [schedule]
    overrides: {scheduler.name: cosine, scheduler.warmup_epochs: 2}

