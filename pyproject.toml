[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "it4653-training-techniques"
version = "0.1.0"
description = "Reproducible training-technique experiments on CIFAR ResNet-18"
requires-python = ">=3.8"
dependencies = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "PyYAML==6.0.2",
  "numpy==1.24.4",
  "pandas==2.0.3",
  "matplotlib==3.7.5",
  "seaborn==0.13.2",
  "tqdm==4.67.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py38"
